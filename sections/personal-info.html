<div class="section-header">

<div class="personal-info-container">

                            <option value="O-">O-</option>

                            <option value="A-">A-</option>

                    <button class="cancel-btn" onclick="cancelEdit('basic')">
                        <i class="fas fa-times"></i> Cancel

<script>
let originalValues = {};

function toggleEdit(section) {
    const inputs = document.querySelectorAll(`#${section}Info input, #${section}Info select, #${section}Info textarea`);
    const actions = document.getElementById(`${section}Actions`);
    const editBtn = event.target.closest('.edit-btn');
    
    // Store original values
    originalValues[section] = {};
    inputs.forEach(input => {
        originalValues[section][input.id] = input.value;
        input.removeAttribute('readonly');
        input.removeAttribute('disabled');
    });
    
    // Show action buttons
    actions.style.display = 'flex';
    editBtn.style.display = 'none';
}

function saveInfo(section) {
    const inputs = document.querySelectorAll(`#${section}Info input, #${section}Info select, #${section}Info textarea`);
    const actions = document.getElementById(`${section}Actions`);
    const editBtn = document.querySelector(`#${section}Info`).closest('.info-card').querySelector('.edit-btn');
    
    // Here you would typically send data to server
    alert(`${section.charAt(0).toUpperCase() + section.slice(1)} information updated successfully!`);
    
    // Make inputs readonly again
    inputs.forEach(input => {
        input.setAttribute('readonly', true);
        if (input.tagName === 'SELECT') {
            input.setAttribute('disabled', true);
        }
    });
    
    // Hide action buttons
    actions.style.display = 'none';
    editBtn.style.display = 'inline-flex';
}

function cancelEdit(section) {
    const inputs = document.querySelectorAll(`#${section}Info input, #${section}Info select, #${section}Info textarea`);
    const actions = document.getElementById(`${section}Actions`);
    const editBtn = document.querySelector(`#${section}Info`).closest('.info-card').querySelector('.edit-btn');
    
    // Restore original values
    inputs.forEach(input => {
        if (originalValues[section][input.id] !== undefined) {
            input.value = originalValues[section][input.id];
        }
        input.setAttribute('readonly', true);
        if (input.tagName === 'SELECT') {
            input.setAttribute('disabled', true);
        }
    });
    
    // Hide action buttons
    actions.style.display = 'none';
    editBtn.style.display = 'inline-flex';
}

function showParentTab(tabName) {
    // Remove active class from all tabs and contents
    const tabs = document.querySelectorAll('.tab-btn');
    const contents = document.querySelectorAll('.tab-content');
    
    tabs.forEach(tab => tab.classList.remove('active'));
    contents.forEach(content => content.classList.remove('active'));
    
    // Add active class to selected tab and content
    event.target.classList.add('active');
    document.getElementById(tabName).classList.add('active');
}

function changeProfilePicture() {
    alert('Opening photo upload dialog...');
    // Add photo upload logic here
}

// Load student data from localStorage
window.addEventListener('DOMContentLoaded', function() {
    const studentData = JSON.parse(localStorage.getItem('currentStudent'));
    if (studentData) {
        document.getElementById('profileName').textContent = studentData.name;
        document.getElementById('profileId').textContent = `Student ID: ${studentData.id}`;
        document.getElementById('profileClass').textContent = `Class: ${studentData.class}`;
    }
});
</script>
